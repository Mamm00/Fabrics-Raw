name: Release v1.1.0

on:
  push:
    branches: [feat/costing-engine, main]
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AlAzharTex-v1.1.0-ci.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Al Azhar Tex v1.1.0 — UI/UX v2
          body: |
            Design system v2: teal/indigo palette with light + dark themes, tabular numerals.
            Adaptive navigation (bottom bar on phones, rail on tablets).
            Tabbed batch workspace: Overview, Intake, Shrinkage, Grades, Cost, Pricing, Benchmark.
            Dashboard KPI cards and actionable warnings; searchable/filterable batch list.
            Live shrinkage with fabric diagram; stacked grade bar; editable calculation rules.
            Bilingual EN/AR with RTL. Builds offline; benchmark requires the backend.

            This CI asset is debug-signed; the locally signed release APK is attached
            separately by the maintainer.
          files: dist/AlAzharTex-v1.1.0-ci.apk
          fail_on_unmatched_files: true
